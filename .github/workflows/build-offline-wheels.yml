name: Build Offline Wheels (Linux x86_64 / py3.12)

# 用途:为无法联网的学院服务器(Ubuntu 24.04 / Python 3.12 / x86_64)
# 离线准备全部 Python 依赖 wheel。在 GitHub 云端 Linux 下载好,打包成 artifact 供下载。
# 触发:手动(Actions 页面点 Run workflow)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip wheel

      - name: Download all dependencies as wheels
        run: |
          mkdir -p offline_wheels
          # GitHub runner 本身就是 Linux x86_64 + Python 3.12(与服务器一致),
          # 所以直接原生 pip download 即可,无需 --platform 跨平台参数
          # (那些严格匹配参数反而导致 No matching distribution 失败)。
          # torch 走 CPU 版源(bge-m3 用 CPU 即可),大幅减小体积、避免拉 CUDA。
          pip download \
            --dest offline_wheels \
            --prefer-binary \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt
          # 把 pip/setuptools/wheel 也下进去备用
          pip download --dest offline_wheels --prefer-binary pip setuptools wheel
          echo "=== 下载结果 ==="
          ls offline_wheels | wc -l
          du -sh offline_wheels
          echo "=== 非 wheel 文件(若有 .tar.gz 需注意服务器能否装)==="
          ls offline_wheels | grep -v '\.whl$' || echo "(全是 wheel,很好)"

      - name: Generate offline install hint
        run: |
          cat > offline_wheels/安装说明.txt <<'EOF'
          离线依赖包 — Linux x86_64 / Python 3.12

          在服务器上(已激活 venv)执行:
            pip install --no-index --find-links=该目录 -r requirements.txt

          若 requirements.txt 不在当前目录,用绝对路径指定 -r。
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-wheels-linux-py312
          path: offline_wheels/
          retention-days: 7
